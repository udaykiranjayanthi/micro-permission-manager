<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Permission Manager Extension</title>
  <style>
    /* CSS styles from App.css and additional styles needed for the components */
    body {
      margin: 0;
      color: #fff;
      font-family: Inter, Avenir, Helvetica, Arial, sans-serif;
      background-image: linear-gradient(to bottom, #020917, #101725);
    }

    .container {
      width: 380px;
      padding: 16px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 16px;
    }

    .header h2 {
      margin: 0;
      margin-bottom: 4px;
    }

    .content {
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .tabInfo {
      font-size: 14px;
      opacity: 0.7;
      margin-bottom: 16px;
      text-align: left;
    }

    .permissionItem {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .permissionName {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 6px;
      text-align: left;
      font-size: 14px;
      flex: 1;
    }

    .status {
      font-size: 12px;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .status.allowed {
      background-color: rgba(0, 255, 0, 0.2);
      color: #8eff8e;
    }

    .status.denied {
      background-color: rgba(255, 0, 0, 0.2);
      color: #ff8e8e;
    }

    .button {
      padding: 4px 12px;
      border-radius: 4px;
      border: none;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      transition: all 0.2s;
      background-color: transparent;
      font-family: Inter, Avenir, Helvetica, Arial, sans-serif;
    }

    .button.allow-tab {
      background-color: #34c759;
      color: white;
    }

    .button.allow-session {
      border: 1px solid #5ac8fa;
      color: #5ac8fa;
    }

    .button.allow-always {
      border: 1px solid #007aff;
      color: #007aff;
    }
    
    .button.deny {
      border: 1px solid #ff3b30;
      color: #ff3b30;
    }
    
    .buttons-container {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-top: 10px;
    }

    .button.outlined {
      background-color: transparent;
      border: 1px solid rgba(255, 255, 255, 0.5);
      color: white;
    }

    .footer {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
    }

    .footerItem {
      cursor: pointer;
      padding: 8px;
      border-radius: 4px;
      transition: background-color 0.2s;
      display: flex;
      align-items: center;
    }

    .footerItem:hover {
      background-color: rgba(255, 255, 255, 0.1);
    }

    .icon {
      margin-right: 4px;
    }

    .greenDot {
      width: 8px;
      height: 8px;
      background-color: #4CAF50;
      border-radius: 50%;
      display: inline-block;
    }

    .noPermissions {
      text-align: center;
      font-size: 14px;
      padding: 16px;
      color: rgba(255, 255, 255, 0.4);
      background-color: rgba(255, 255, 255, 0.1);
      border-radius: 6px;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 24px;
    }
    .switch input { display: none; }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #ccc;
      transition: .4s;
      border-radius: 24px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .4s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: #4caf50;
    }
    input:checked + .slider:before {
      transform: translateX(20px);
    }

    /* Theme support */
    html[data-theme="light"] {
      color-scheme: light;
    }

    html[data-theme="dark"] {
      color-scheme: dark;
    }

    html[data-theme="light"] body {
      background-image: linear-gradient(to bottom, #ffffff, #e0e0e0);
      color: #333;
    }

    html[data-theme="light"] .content {
      border-color: rgba(0, 0, 0, 0.1);
    }

    html[data-theme="light"] .permissionItem {
      border-bottom-color: rgba(0, 0, 0, 0.1);
    }

    html[data-theme="light"] .button.outlined {
      border-color: rgba(0, 0, 0, 0.3);
      color: #333;
    }

    html[data-theme="light"] .status.allowed {
      background-color: rgba(0, 255, 0, 0.2);
      color: #376437;
    }

    html[data-theme="light"] .status.denied {
      background-color: rgba(255, 0, 0, 0.2);
      color: #6e3d3d;
    }

    html[data-theme="light"] .footerItem:hover {
      background-color: rgba(0, 0, 0, 0.05);
    }

    html[data-theme="light"] .noPermissions {
      color: rgba(0, 0, 0, 0.4);
      background-color: rgba(0, 0, 0, 0.1);
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="container">
      <div class="header">
        <h2>Micro Permission Manager</h2>

        <div style="display: flex; align-items: center; gap: 16px;">
          <!-- Status Switch -->
          <div style="display: flex; flex-direction: column; align-items: center;">
            <label id="status-label" style="font-size: 12px; margin-bottom: 2px;" for="enable-switch">Enable</label>
            <label class="switch">
              <input type="checkbox" id="status-switch">
              <span class="slider round"></span>
            </label>
          </div>

          <!-- Theme Switch -->
          <div style="display: flex; flex-direction: column; align-items: center;">
            <label id="theme-label" style="font-size: 12px; margin-bottom: 2px;" for="theme-switch">Theme</label>
            <label class="switch">
              <input type="checkbox" id="theme-switch">
              <span class="slider round"></span>
            </label>
          </div>
        </div>
      </div>

      <div class="content" id="content">
        <div class="tabInfo">Current Tab: 
          <span class="greenDot"></span>
          <span id="current-tab"></span></div>
        <div id="permissions-container">
          <div class="noPermissions">
            This tab has no permissions.
          </div>
          <!-- Permission items will be inserted here by JavaScript -->
        </div>
      </div>

      <div class="footer" id="footer">
        <div class="footerItem" id="settings">
          <span class="icon">⚙️</span> Settings
        </div>
        <div class="footerItem" id="view-history">
          <span class="icon">📜</span> View History
        </div>
        <div class="footerItem" id="clear-all">
          <span class="icon">🧹</span> Clear All Permissions
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="../popup.js"></script>
</body>
</html>
